name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Make deploy script executable
        run: chmod +x ./deploy/deploy.sh

      - name: Setup SSH Key & Run Deploy Script
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          ./deploy/deploy.sh -h "$EC2_HOST" -i /tmp/ec2_key.pem

      - name: Clean up temporary SSH Key
        if: always()
        run: rm -f /tmp/ec2_key.pem
