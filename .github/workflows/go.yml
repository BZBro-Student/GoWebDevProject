name: Go CI Pipeline

on:
  push:
    branches: [ "main", "master", "working-branch" ]
  pull_request:
    branches: [ "main", "master", "working-branch" ]

  permissions:
	  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build application
        run: go build -v ./...