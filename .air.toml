root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/app"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "templ", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "data", "static"]
  delay = 1000 # ms

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"